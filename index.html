<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Neon Collector</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div id="game">

        <!-- TOP HUD -->

        <header class="hud">

            <div class="logo">
                <span>◆</span>
                NEON COLLECTOR
            </div>

            <div class="stats">

                <div class="stat">
                    ⭐
                    <span id="score">
                        0000
                    </span>
                </div>

                <div class="stat">
                    💎
                    <span id="collected">
                        0
                    </span>
                </div>

                <div class="stat">
                    ❤️
                    <span id="lives">
                        3
                    </span>
                </div>

                <div class="stat">
                    LEVEL
                    <span id="level">
                        1
                    </span>
                </div>

            </div>

        </header>


        <!-- GAME CANVAS -->

        <canvas id="canvas"></canvas>


        <!-- START SCREEN -->

        <div
            id="startScreen"
            class="screen"
        >

            <div class="card">

                <div class="icon">
                    ◆
                </div>

                <p class="smallTitle">
                    ARCADE EXPERIENCE
                </p>

                <h1>
                    NEON
                    <span>COLLECTOR</span>
                </h1>

                <p class="description">
                    Collect the crystals.
                    Avoid the enemies.
                    Beat every level.
                </p>


                <div class="controls">

                    <div>
                        <kbd>W</kbd>
                        <kbd>A</kbd>
                        <kbd>S</kbd>
                        <kbd>D</kbd>
                    </div>

                    <div>
                        OR
                    </div>

                    <div>
                        <kbd>←</kbd>
                        <kbd>↑</kbd>
                        <kbd>↓</kbd>
                        <kbd>→</kbd>
                    </div>

                </div>


                <button
                    id="startButton"
                >
                    START GAME
                    <span>→</span>
                </button>

            </div>

        </div>


        <!-- LEVEL COMPLETE -->

        <div
            id="levelScreen"
            class="screen hidden"
        >

            <div class="card">

                <div class="success">
                    ✓
                </div>

                <p class="smallTitle">
                    LEVEL COMPLETE
                </p>

                <h2>
                    GREAT
                    <span>JOB!</span>
                </h2>

                <div class="result">

                    <div>

                        <strong id="levelScore">
                            0
                        </strong>

                        <small>
                            SCORE
                        </small>

                    </div>

                    <div>

                        <strong id="levelCrystals">
                            0
                        </strong>

                        <small>
                            CRYSTALS
                        </small>

                    </div>

                </div>


                <button
                    id="nextButton"
                >
                    NEXT LEVEL →
                </button>

            </div>

        </div>


        <!-- GAME OVER -->

        <div
            id="gameOverScreen"
            class="screen hidden"
        >

            <div class="card">

                <div class="danger">
                    ×
                </div>

                <p class="smallTitle">
                    GAME OVER
                </p>

                <h2>
                    TRY
                    <span>AGAIN</span>
                </h2>

                <div class="final">

                    <small>
                        FINAL SCORE
                    </small>

                    <strong id="finalScore">
                        0000
                    </strong>

                </div>


                <button
                    id="restartButton"
                >
                    PLAY AGAIN
                </button>

            </div>

        </div>


        <!-- GAME INSTRUCTION -->

        <div class="instruction">

            <span>MOVE</span>

            WASD / ARROW KEYS

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
